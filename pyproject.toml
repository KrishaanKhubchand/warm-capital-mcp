[project]
name = "warm-capital-mcp"
version = "0.1.0"
description = "MCP server for the Warm Capital CRM (Convex HTTP API)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
